version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kb_postgres
    environment:
      POSTGRES_USER: kbadmin
      POSTGRES_PASSWORD: kbpass123
      POSTGRES_DB: knowledge_base
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kbadmin -d knowledge_base"]
      interval: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: kb_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

volumes:
  pgdata:
  qdrant_data:
